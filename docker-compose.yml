# Chạy cả dự án bằng một lệnh: docker compose up --build
#   Giao diện : http://localhost:5173
#   API       : http://localhost:3000/api/health
#   CSDL      : 127.0.0.1:5433 (user nhom03, mật khẩu nhom03, CSDL suachua_dev) - đổi cổng bằng biến DB_PORT
# Các cổng chỉ mở ở 127.0.0.1 vì mật khẩu CSDL dành cho phát triển. Chi tiết: docs/huong-dan-docker.md
name: cdtn2-nhom03

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nhom03
      POSTGRES_PASSWORD: nhom03
      POSTGRES_DB: suachua_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chỉ chạy lần đầu khi volume còn trống: tạo thêm CSDL suachua_test cho npm test.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Cổng 5433 để không đụng PostgreSQL cài sẵn trên máy (thường dùng 5432).
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhom03 -d suachua_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: cdtn2-nhom03:dev
    # Dựng bảng (chạy migration chưa chạy) rồi mới khởi động API.
    command: sh -c "npm run migrate && npm start"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://nhom03:nhom03@db:5432/suachua_dev
      TEST_DATABASE_URL: postgres://nhom03:nhom03@db:5432/suachua_test
      # Khóa dành cho phát triển; đặt biến JWT_SECRET (trong .env hoặc môi trường) để dùng khóa riêng.
      JWT_SECRET: ${JWT_SECRET:-khoa-jwt-chi-dung-khi-phat-trien-bang-docker}
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: http://localhost:5173
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build: .
    image: cdtn2-nhom03:dev
    # --host để cổng được mở ra ngoài container; /api được Vite chuyển tiếp sang dịch vụ api.
    command: npm --prefix frontend run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
